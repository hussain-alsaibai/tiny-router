name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # tiny-secret-mask is an optional runtime dependency of the
        # header-redaction sidecar (the middleware is a passthrough without
        # it). It is not on PyPI yet, so install it from GitHub.
        run: |
          pip install pytest
          pip install "tiny-secret-mask @ git+https://github.com/hussain-alsaibai/tiny-secret-mask.git"
      - name: Run test suite
        run: python -m pytest test_*.py -v
